[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python-clay"
version = "0.1.0"
description = "Python bindings for the Clay C flexbox layout engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "David" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Source = "https://github.com/davtheconquerer/python-clay"
